name: ClaudeVision
options:
  bundleIdPrefix: com.alvinseeras
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.0"

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    minorVersion: "0.9.0"

targets:
  ClaudeVision:
    type: application
    platform: iOS
    sources:
      - ClaudeVision
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
    settings:
      base:
        INFOPLIST_FILE: ClaudeVision/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.alvinseeras.claudevision
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ClaudeVision:
    build:
      targets:
        ClaudeVision: all
    run:
      config: Debug
